<span class="section-title font-mono" [attr.aria-label]="label">
  <span class="section-number" aria-hidden="true">{{ number }}</span>
  <!-- o rótulo completo e invisível reserva a largura final do pill -->
  <span class="section-text" aria-hidden="true">
    <span class="section-ghost">{{ label }}</span>
    <span class="section-typed">{{ typed() }}<span class="section-caret"></span></span>
  </span>
</span>
