<section id="about" class="relative my-12 lg:my-24">
  <div class="mb-10 flex justify-center lg:mb-16">
    <div class="flex items-center">
      <span class="h-[2px] w-6 bg-[#1a1443] sm:w-24"></span>
      <app-section-title [index]="1" [label]="'app.about.title' | translate"></app-section-title>
      <span class="h-[2px] w-6 bg-[#1a1443] sm:w-24"></span>
    </div>
  </div>

  <div class="grid grid-cols-1 items-center gap-12 lg:grid-cols-[1.35fr_1fr] lg:gap-16">

    <!-- ===== Texto ===== -->
    <div class="order-2 lg:order-1">
      <div class="about-text flex flex-col gap-4 text-gray-300 lg:text-lg">
        <p [innerHTML]="withYears(('app.about.p1' | translate))"></p>
        <p [innerHTML]="'app.about.p2' | translate"></p>
        <p [innerHTML]="'app.about.p3' | translate"></p>
      </div>

      <p *ngIf="current" class="current-role mt-6">
        <span class="text-[#16f2b3]">&gt;</span>
        <span class="text-white/50"> {{ 'app.about.currently' | translate }}:</span>
        <span class="text-white"> {{ current.title }}</span>
        <span class="text-pink-500"> &#64; </span>
        <span class="text-white">{{ current.company }}</span>
      </p>

      <!-- números em uma linha discreta -->
      <ul class="about-stats mt-8">
        <li *ngFor="let stat of stats; let i = index" class="stat">
          <span class="stat-value">{{ displayed()[i] }}{{ stat.suffix }}</span>
          <span class="stat-label">{{ stat.label | translate }}</span>
        </li>
      </ul>
    </div>

    <!-- ===== Foto (solta, como no original) ===== -->
    <div class="order-1 flex justify-center lg:order-2">
      <div class="photo-wrap">
        <img
          [ngSrc]="personalData.profile"
          [alt]="personalData.name"
          class="photo"
          [height]="380"
          [width]="266"
        />
      </div>
    </div>
  </div>
</section>
