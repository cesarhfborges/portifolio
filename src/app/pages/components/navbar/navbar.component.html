<header
  class="nav-bar sticky top-0 z-[100] flex h-20 items-center text-white"
  [class.nav-bar--scrolled]="isScrolled || isMenuOpen"
>
  <!-- mesmo container do <main> (app.component.html) para alinhar logo e links ao conteúdo -->
  <nav
    class="relative mx-auto flex w-full items-center justify-between gap-6 px-6 sm:px-12 lg:max-w-[70rem] xl:max-w-[76rem] 2xl:max-w-[92rem]"
    aria-label="Main"
  >
    <a routerLink="/" class="nav-brand flex shrink-0 items-center text-2xl font-bold" aria-label="César Borges">
      <img
        ngSrc="assets/icons/android-chrome-192x192.png"
        class="mr-3"
        alt=""
        [priority]="true"
        [height]="30"
        [width]="30"
      />
      <span class="inline md:hidden xl:inline">
        <span class="text-white">César</span>
        <span class="brand-gradient"> Borges</span>
      </span>
    </a>

    <div class="flex items-center gap-2">
      <ul class="hidden md:flex flex-row items-center">
        <li *ngFor="let item of navItems; let i = index">
          <a
            href="{{item.path}}"
            class="nav-link"
            [class.nav-link--active]="activeSection === item.id"
            [attr.aria-current]="activeSection === item.id ? 'location' : null"
          >
            <span class="nav-index hidden lg:inline">{{ indexLabel(i) }}</span>
            {{ (item.label | translate) | lowercase }}
          </a>
        </li>
      </ul>

      <!-- alternador de idioma -->
      <div class="lang-switch hidden md:flex" role="group" [attr.aria-label]="'app.menu.language' | translate">
        <ng-container *ngFor="let lang of _translationService.langs; let last = last">
          <button
            type="button"
            class="lang-option"
            [class.lang-option--active]="isCurrentLang(lang.value)"
            [attr.aria-pressed]="isCurrentLang(lang.value)"
            [attr.title]="lang.label"
            (click)="setLang(lang.value)"
          >{{ lang.code | uppercase }}</button>
          <span *ngIf="!last" class="lang-sep" aria-hidden="true">|</span>
        </ng-container>
      </div>

      <button
        type="button"
        class="burger md:hidden"
        [class.burger--open]="isMenuOpen"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="mobileMenu"
        aria-label="Menu"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- progresso de leitura -->
  <span
    class="nav-progress"
    aria-hidden="true"
    [style.transform]="'scaleX(' + scrollProgress + ')'"
  ></span>
</header>

<div
  id="mobileMenu"
  class="mobile-menu fixed inset-0 z-[90] flex flex-col px-6 pt-28 pb-10 md:hidden"
  [class.mobile-menu--open]="isMenuOpen"
  [attr.aria-hidden]="!isMenuOpen"
>
  <ul class="flex flex-col gap-1">
    <li *ngFor="let item of navItems; let i = index" class="mobile-item" [style.transition-delay.ms]="isMenuOpen ? 60 + i * 40 : 0">
      <a
        href="{{item.path}}"
        class="nav-link nav-link--lg"
        [class.nav-link--active]="activeSection === item.id"
        [attr.tabindex]="isMenuOpen ? null : -1"
        (click)="toggleMenu()"
      >
        <span class="nav-index">{{ indexLabel(i) }}</span>
        {{ (item.label | translate) | lowercase }}
      </a>
    </li>
  </ul>

  <div class="mt-auto">
    <div class="lang-switch lang-switch--lg" role="group" [attr.aria-label]="'app.menu.language' | translate">
      <ng-container *ngFor="let lang of _translationService.langs; let last = last">
        <button
          type="button"
          class="lang-option"
          [class.lang-option--active]="isCurrentLang(lang.value)"
          [attr.aria-pressed]="isCurrentLang(lang.value)"
          [attr.tabindex]="isMenuOpen ? null : -1"
          (click)="setLang(lang.value)"
        >{{ lang.label }}</button>
        <span *ngIf="!last" class="lang-sep" aria-hidden="true">|</span>
      </ng-container>
    </div>
  </div>
</div>
