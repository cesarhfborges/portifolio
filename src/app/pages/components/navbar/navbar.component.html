<header
  class="nav-bar sticky top-0 z-[100] flex h-20 items-center"
  [class.nav-bar--scrolled]="isScrolled || isMenuOpen"
>
  <nav class="relative flex w-full items-center justify-between" aria-label="Main">
    <a routerLink="/" class="nav-brand flex items-center text-3xl font-bold text-[#0065CF]">
      <img
        ngSrc="assets/icons/android-chrome-192x192.png"
        class="mr-3"
        alt="App logo"
        [priority]="true"
        [height]="32"
        [width]="32"
      />
      <span class="contents md:hidden xl:contents">César Borges</span>
    </a>

    <div class="flex items-center">
      <ul class="hidden md:flex flex-row items-center gap-1">
        <li *ngFor="let item of navItems">
          <a
            href="{{item.path}}"
            class="nav-link"
            [class.nav-link--active]="activeSection === item.id"
            [attr.aria-current]="activeSection === item.id ? 'location' : null"
          >
            {{ (item.label | translate) | uppercase }}
          </a>
        </li>

        <li class="relative ml-1 flex items-center pl-2 before:mr-2 before:h-4 before:w-px before:bg-white/15 before:content-['']">
          <button
            type="button"
            id="dropdownToggle"
            class="nav-link flex items-center gap-2"
            [class.nav-link--active]="isDropdownOpen"
            [attr.aria-expanded]="isDropdownOpen"
            (click)="toggleDropdown()"
          >
            {{ ('app.menu.language' | translate) | uppercase }}
            <fa-icon [icon]="faGlobe" size="1x"></fa-icon>
          </button>

          <div
            id="dropdownMenu"
            class="nav-dropdown absolute right-0 top-full mt-3 w-48"
            [class.hidden]="!isDropdownOpen"
          >
            <div class="p-1" role="menu" aria-orientation="vertical" aria-labelledby="dropdownToggle">
              <a
                *ngFor="let lang of _translationService.langs"
                href="javascript:void(0)"
                class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-white/80 transition-colors hover:bg-white/5 hover:text-white"
                role="menuitem"
                (click)="setLang(lang.value)"
              >
                <img [ngSrc]="lang.icon" [alt]="lang.label" [height]="20" [width]="20">
                {{ lang.label }}
              </a>
            </div>
          </div>
        </li>
      </ul>

      <button
        type="button"
        class="text-white md:hidden p-2 rounded-lg transition-colors hover:text-pink-500 focus:outline-none"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Menu"
        (click)="toggleMenu()"
      >
        <fa-icon [icon]="isMenuOpen ? faTimes : faBars" size="xl"></fa-icon>
      </button>
    </div>
  </nav>
</header>

<div
  class="mobile-menu fixed inset-0 z-[90] flex flex-col items-center pt-28 md:hidden"
  [class.mobile-menu--open]="isMenuOpen"
  [attr.aria-hidden]="!isMenuOpen"
>
  <ul class="flex flex-col items-center gap-2">
    <li *ngFor="let item of navItems">
      <a
        href="{{item.path}}"
        class="nav-link nav-link--lg"
        [class.nav-link--active]="activeSection === item.id"
        (click)="toggleMenu()"
      >
        {{ (item.label | translate) | uppercase }}
      </a>
    </li>

    <li class="relative mt-4">
      <button
        type="button"
        id="dropdownToggleMobile"
        class="nav-link nav-link--lg flex items-center gap-2"
        [class.nav-link--active]="isDropdownOpen"
        [attr.aria-expanded]="isDropdownOpen"
        (click)="toggleDropdown()"
      >
        {{ ('app.menu.language' | translate) | uppercase }}
        <fa-icon [icon]="faGlobe" size="1x"></fa-icon>
      </button>

      <div
        class="nav-dropdown absolute left-1/2 top-full mt-3 w-48 -translate-x-1/2"
        [class.hidden]="!isDropdownOpen"
      >
        <div class="p-1" role="menu" aria-orientation="vertical" aria-labelledby="dropdownToggleMobile">
          <a
            *ngFor="let lang of _translationService.langs"
            href="javascript:void(0)"
            class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-white/80 transition-colors hover:bg-white/5 hover:text-white"
            role="menuitem"
            (click)="setLang(lang.value)"
          >
            <img [ngSrc]="lang.icon" [alt]="lang.label" [height]="20" [width]="20">
            {{ lang.label }}
          </a>
        </div>
      </div>
    </li>
  </ul>
</div>
